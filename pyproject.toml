[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-video-localizer"
version = "2.1.1"
description = "Download YouTube videos, repair and translate subtitles, and create Chinese-dubbed videos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=45,<47",
]

[project.scripts]
youtube-video-localizer = "videodub.ui:main"

[tool.setuptools.packages.find]
include = ["videodub*"]

[tool.uv]
package = true
