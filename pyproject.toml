[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scip"
version = "2.1.3"
description = "Download YouTube videos, repair and translate subtitles, and create Chinese-dubbed videos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "audioop-lts>=0.2; python_version >= '3.13'",
    "cryptography>=45,<47",
    "openai>=1,<3",
    "pydub>=0.25,<1",
]

[project.scripts]
scip = "videodub.ui:main"

[tool.setuptools.packages.find]
include = ["videodub*"]

[tool.uv]
package = true
